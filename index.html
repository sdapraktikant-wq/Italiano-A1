for(const k in TOP){const f=TOP[k][1];TOP[k][1]=()=>{const r=f();try{r[3]=TRF[k](r[0],r[1])}catch(e){}return r}}
const trH=()=>S.cur.tr?`<p style="color:var(--mut);margin:8px 0 0">Übersetzung: ${S.cur.tr}</p>`:"";
function ac(c){const e=document.getElementById("ti");e.setRangeText(c,e.selectionStart,e.selectionEnd,"end");e.focus()}
const nm=s=>s.toLowerCase().replace(/[\u2019`\u00b4]/g,"'").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
function gT(){const c=S.cur;if(c.done)return;const e=document.getElementById("ti");c.done=1;const ok=nm(e.value)==nm(c.c);if(ok)S.sc2++;e.disabled=true;e.classList.add(ok?"ok":"no");S.i++;document.getElementById("nx").innerHTML=`<p style="margin:10px 0 0;font-weight:600">${ok?"Richtig!":"Richtig wäre: "+c.c}</p>${trH()}<button class="p" style="width:100%;margin-top:12px" onclick="gQ()">Weiter</button>`}

// ===== UI =====
const $=document.getElementById("app");let S={sc:"home"};
const h=(x)=>$.innerHTML=x;
const tp=(t)=>`<div class="top"><b>${t}</b><button onclick="home()">✕ Beenden</button></div>`;
function home(){S={sc:"home"};h(`<h1>Italiano A1</h1><p class="s">Wortschatz &amp; Grammatik</p><div class="col"><button class="p" onclick="vSetup()">Vokabeln üben</button><button class="p" onclick="gSetup()">Grammatik üben</button></div>`)}
function vSetup(){S={sc:"vs",units:new Set(["0"]),ord:"rnd"};vDraw()}
function vDraw(){const ks=Object.keys(U),all=ks.filter(k=>U[k].length);
 h(`<div class="top"><b>Vokabeln</b><button onclick="home()">Zurück</button></div><h2>Welche Unità?</h2><div class="row">${ks.map(k=>`<button class="${S.units.has(k)?"on":""}" ${U[k].length?"":"disabled"} onclick="tg('${k}')">Unità ${k}<br><small>${U[k].length} Wörter</small></button>`).join("")}<button class="${S.units.size==all.length?"on":""}" onclick="S.units=new Set(${JSON.stringify(all)});vDraw()">Alle</button></div>
 <h2>Reihenfolge</h2><div class="row"><button class="${S.ord=="seq"?"on":""}" onclick="S.ord='seq';vDraw()">Der Reihe nach</button><button class="${S.ord=="rnd"?"on":""}" onclick="S.ord='rnd';vDraw()">Zufällig</button></div>
 <p class="s" style="margin-top:14px">Die Richtung (IT→DE oder DE→IT) ist immer zufällig.</p><button class="p" style="width:100%" ${S.units.size?"":"disabled"} onclick="vStart()">Los geht's</button>`)}
function tg(k){S.units.has(k)?S.units.delete(k):S.units.add(k);vDraw()}
function vStart(){let w=[];[...S.units].sort().forEach(k=>w.push(...U[k]));if(S.ord=="rnd")w=sh(w);S={...S,sc:"v",q:w,n:w.length,i:0,show:false,miss:0};vCard()}
function vCard(){if(!S.q.length)return h(`${tp("Fertig! 🎉")}<div class="card"><div class="big">${S.n} Wörter geschafft</div><p class="s">${S.miss} Mal "nochmal" gedrückt</p></div><div class="col" style="margin-top:12px"><button class="p" onclick="vStart()">Nochmal</button><button onclick="vSetup()">Andere Auswahl</button></div>`);
 const w=S.q[0];if(S.dir===undefined||S.show===false&&S.fresh!==w){S.dir=Math.random()<.5;S.fresh=w}
 const a=S.dir?w.it:w.de,b=S.dir?w.de:w.it,done=S.n-S.q.length;
 h(`${tp("Unità "+w.u)}<div class="bar"><i style="width:${done/S.n*100}%"></i></div><div class="card"><div class="tag">${S.dir?"Italienisch → Deutsch":"Deutsch → Italienisch"}</div><div class="big">${a}</div>${S.show?`<div class="ans">${b}</div>`:""}</div><div class="col" style="margin-top:12px">${S.show?`<div class="row"><button onclick="vNext(0)">Nochmal</button><button class="p" onclick="vNext(1)">Gewusst</button></div>`:`<button class="p" onclick="S.show=true;vCard()">Antwort zeigen</button>`}</div><p class="s" style="text-align:center;margin-top:10px">Noch ${S.q.length} offen</p>`)}
function vNext(ok){const w=S.q.shift();if(!ok){S.q.push(w);S.miss++}S.show=false;S.fresh=null;vCard()}
function gSetup(){h(`<div class="top"><b>Grammatik</b><button onclick="home()">Zurück</button></div><h2>Antwortart</h2><div class="row">${[["mc","Auswahl"],["type","Eintippen"],["mix","Gemischt"]].map(([k,t])=>`<button class="${GM==k?"on":""}" onclick="GM='${k}';gSetup()">${t}</button>`).join("")}</div><h2>Thema wählen</h2><div class="col">${Object.keys(TOP).map(k=>`<button onclick="gStart('${k}')">${TOP[k][0]}</button>`).join("")}<button class="p" onclick="gStart('all')">Alles gemischt</button></div>`)}
function gStart(t){S={sc:"g",t,i:0,sc2:0,N:10};gQ()}
function gQ(){if(S.i>=S.N)return h(`${tp("Ergebnis")}<div class="card"><div class="big">${S.sc2} / ${S.N}</div><p class="s">richtig</p></div><div class="col" style="margin-top:12px"><button class="p" onclick="gStart('${S.t}')">Nochmal</button><button onclick="gSetup()">Anderes Thema</button></div>`);
 const t=S.t=="all"?sh(Object.keys(TOP))[0]:S.t;S.cur=mkQ(t);S.cur.t=t;
 h(`${(S.cur.ty=GM=="type"||(GM=="mix"&&Math.random()<.5),"")}${tp(TOP[t][0])}<div class="bar"><i style="width:${S.i/S.N*100}%"></i></div><div class="card"><div class="big">${S.cur.q}</div></div>${S.cur.ty?`<input id="ti" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Antwort eintippen" style="width:100%;margin-top:12px;padding:13px;font:inherit;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)" onkeydown="if(event.key=='Enter')gT()"><div class="row" style="margin-top:8px">${[..."àèéìòù"].map(c=>`<button style="flex:1 1 12%;padding:8px" onmousedown="event.preventDefault()" onclick="ac('${c}')">${c}</button>`).join("")}</div><button class="p" style="width:100%;margin-top:8px" onclick="gT()">Prüfen</button>`:`<div class="row" style="margin-top:12px">${S.cur.o.map((o,j)=>`<button id="o${j}" onclick="gA(${j})">${o}</button>`).join("")}</div>`}<div id="nx"></div>`);if(S.cur.ty)document.getElementById("ti").focus()}
function gA(j){const c=S.cur;if(c.done)return;c.done=1;const ok=c.o[j]==c.c;if(ok)S.sc2++;document.getElementById("o"+j).classList.add(ok?"ok":"no");c.o.forEach((o,k)=>{if(o==c.c)document.getElementById("o"+k).classList.add("ok")});S.i++;document.getElementById("nx").innerHTML=trH()+`<button class="p" style="width:100%;margin-top:12px" onclick="gQ()">Weiter</button>`}
home();
</script></body></html>
